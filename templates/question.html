{% extends "base.html" %}{% block content %}
<section class="quiztop"><span>PYTHON BASICS</span><span>Question {{ number+1 }} of {{ total }}</span></section>
<div class="progress"><div style="width:{{ ((number+1)/total)*100 }}%"></div></div>
<section class="card questioncard"><p class="eyebrow">QUESTION {{ number+1 }}</p><h1>{{ question }}</h1>
<form method="post"><div class="options">{% for option in options %}<label class="option"><input type="radio" name="answer" value="{{ option }}" required {% if selected==option %}checked{% endif %}><span>{{ option }}</span></label>{% endfor %}</div>
<button class="nextbtn">{% if number+1==total %}Finish Quiz{% else %}Next Question →{% endif %}</button></form></section>
{% endblock %}
