{% extends "base.html" %}{% block content %}
<section class="auth card"><div class="logo">✨</div><h1>Create account</h1><p class="muted">Start practicing Python today.</p>
<form method="post"><label>Username</label><input name="username" required minlength="3" placeholder="Choose username"><label>Password</label><input name="password" type="password" required minlength="4" placeholder="Choose password"><button>Create Account</button></form>
<p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></section>{% endblock %}
